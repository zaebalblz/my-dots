<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura OS | v1.1 Neural Interface</title>
    <style>
        :root {
            --bg: #030303;
            --accent: #00f2ff;
            --accent-rgb: 0, 242, 255;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --subtext: #a0a0a0;
        }

        @keyframes scan {
            0% { background-position: 0 -100vh; }
            100% { background-position: 0 100vh; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0, 242, 255, 0.02) 50%, transparent);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.3;
        }

        #canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.4;
        }

        header {
            position: relative;
            z-index: 2;
            padding: 30px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .time-block {
            text-align: left;
        }

        #clock {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
        }

        #date {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.7rem;
            margin-top: 10px;
        }

        .quote-block {
            max-width: 400px;
            text-align: right;
            font-style: italic;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .interface {
            position: relative;
            z-index: 1;
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 30px;
            padding: 0 5vw 40px 5vw;
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            animation: panelFade 1s ease-out;
        }

        @keyframes panelFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel:hover {
            border-color: rgba(var(--accent-rgb), 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }

        /* Tasks */
        .task-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 25px;
            color: white;
            width: 100%;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
        }

        .task-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.1);
        }

        .task-list {
            flex: 1;
            overflow-y: auto;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 18px 22px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border);
            transform: scale(1.02);
        }

        /* Timer Center */
        .center-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .timer-val {
            font-size: 10rem;
            font-weight: 100;
            letter-spacing: -8px;
            margin: 10px 0;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            background: white;
            color: black;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: white;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .btn-primary:hover {
            background: var(--accent);
            box-shadow: 0 0 40px rgba(var(--accent-rgb), 0.5);
        }

        /* Sounds */
        .sound-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sound-node {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .sound-node.active {
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.08);
        }

        .node-icon {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--border);
        }

        .active .node-icon {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <header>
        <div class="time-block">
            <div id="clock">00:00</div>
            <div id="date">Loading Satellites...</div>
        </div>
        <div class="quote-block" id="quote">
            "Будущее принадлежит тем, кто верит в красоту своих мечтаний."
        </div>
    </header>

    <div class="interface">
        <div class="panel">
            <h2>System Tasks</h2>
            <input type="text" class="task-input" id="tInput" placeholder="Добавить нейро-задачу...">
            <div class="task-list" id="tList"></div>
        </div>

        <div class="panel center-content">
            <h2>Neural Focus</h2>
            <div class="timer-val" id="tDisp">25:00</div>
            <div class="controls">
                <button class="btn btn-primary" id="startBtn">Initiate</button>
                <button class="btn btn-outline" id="resetBtn">Reset</button>
            </div>
        </div>

        <div class="panel">
            <h2>Atmosphere Engine</h2>
            <div class="sound-stack">
                <div class="sound-node" onclick="this.classList.toggle('active')">
                    <div class="node-icon"></div>
                    <div>
                        <div style="font-weight: 600;">Rainfall</div>
                        <div style="font-size: 0.7rem; opacity: 0.5;">Organic Audio</div>
                    </div>
                </div>
                <div class="sound-node" onclick="this.classList.toggle('active')">
                    <div class="node-icon"></div>
                    <div>
                        <div style="font-weight: 600;">Solar Wind</div>
                        <div style="font-size: 0.7rem; opacity: 0.5;">Synthetic Sine</div>
                    </div>
                </div>
                <div class="sound-node" onclick="this.classList.toggle('active')">
                    <div class="node-icon"></div>
                    <div>
                        <div style="font-weight: 600;">Deep Static</div>
                        <div style="font-size: 0.7rem; opacity: 0.5;">White Noise</div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: auto; padding-top: 30px; opacity: 0.3; font-size: 0.6rem; text-align: center; letter-spacing: 2px;">
                CONNECTED TO AETHERIA NETWORK // SECURE
            </div>
        </div>
    </div>

    <script>
        // --- CLOCK & DATE ---
        function updTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
            const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', opts);
        }
        setInterval(updTime, 1000);
        updTime();

        // --- QUOTES ---
        const quotes = [
            "Код — это поэзия логики.",
            "Тишина — это самый громкий звук концентрации.",
            "Система стабильна. Твой разум — тоже.",
            "Создавай то, что невозможно игнорировать.",
            "Вчера — это история, завтра — это тайна."
        ];
        document.getElementById('quote').textContent = `"${quotes[Math.floor(Math.random()*quotes.length)]}"`;

        // --- GENERATIVE BG ---
        const canv = document.getElementById('canvas');
        const ctx = canv.getContext('2d');
        let w, h, balls = [];

        function initBg() {
            w = canv.width = window.innerWidth;
            h = canv.height = window.innerHeight;
            balls = Array(8).fill(0).map(() => ({
                x: Math.random()*w, y: Math.random()*h,
                r: Math.random()*400+200,
                vx: (Math.random()-0.5)*0.8, vy: (Math.random()-0.5)*0.8,
                c: Math.random() > 0.5 ? '#00f2ff' : '#0044ff'
            }));
        }

        function drawBg() {
            ctx.fillStyle = '#030303';
            ctx.fillRect(0,0,w,h);
            balls.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if(b.x<0 || b.x>w) b.vx*=-1;
                if(b.y<0 || b.y>h) b.vy*=-1;
                let g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                g.addColorStop(0, b.c);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(drawBg);
        }
        window.onresize = initBg; initBg(); drawBg();

        // --- PERSISTENT TASKS ---
        const tIn = document.getElementById('tInput');
        const tList = document.getElementById('tList');
        
        function saveTasks() {
            const tasks = Array.from(tList.querySelectorAll('.task-item span')).map(s => s.textContent);
            localStorage.setItem('aura_tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('aura_tasks') || '[]');
            tasks.forEach(t => addTask(t, false));
        }

        function addTask(val, save = true) {
            const d = document.createElement('div');
            d.className = 'task-item';
            d.innerHTML = `<span>${val}</span><small style="opacity:0.2;cursor:pointer" onclick="this.parentElement.remove(); saveTasks()">✕</small>`;
            tList.prepend(d);
            if(save) saveTasks();
        }

        tIn.onkeypress = (e) => {
            if(e.key==='Enter' && tIn.value) {
                addTask(tIn.value);
                tIn.value = '';
            }
        };
        loadTasks();

        // --- TIMER ---
        let sec = 25*60, tId = null;
        const disp = document.getElementById('tDisp');
        const sBtn = document.getElementById('startBtn');

        function updDisp() {
            disp.textContent = `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
        }

        sBtn.onclick = () => {
            if(tId) { 
                clearInterval(tId); tId = null; sBtn.textContent = 'Continue';
                sBtn.classList.remove('btn-outline');
            } else {
                tId = setInterval(() => { if(sec>0) { sec--; updDisp(); } }, 1000);
                sBtn.textContent = 'Pause';
                sBtn.classList.add('btn-outline');
            }
        };

        document.getElementById('resetBtn').onclick = () => {
            clearInterval(tId); tId = null; sec = 25*60; updDisp(); sBtn.textContent = 'Initiate';
            sBtn.classList.remove('btn-outline');
        };
    </script>
</body>
</html>
